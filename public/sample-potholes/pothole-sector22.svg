<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="potholeDepthS22" cx="48%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#0a0a0c" />
      <stop offset="60%" stop-color="#191c20" />
      <stop offset="100%" stop-color="#3c444c" />
    </radialGradient>
    <linearGradient id="roadSurfaceS22" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b4046" />
      <stop offset="100%" stop-color="#2a2e33" />
    </linearGradient>
    <filter id="shadowS22">
      <feDropShadow dx="3" dy="4" stdDeviation="4" flood-color="#050607" flood-opacity="0.8" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#roadSurfaceS22)" />

  <!-- Road markings: Zebra Crossing Partial Pattern (Urban Market Crossing) -->
  <rect x="0" y="80" width="140" height="40" fill="#e2e8f0" opacity="0.4" />
  <rect x="220" y="80" width="140" height="40" fill="#e2e8f0" opacity="0.4" />
  <rect x="440" y="80" width="140" height="40" fill="#e2e8f0" opacity="0.4" />
  <rect x="660" y="80" width="140" height="40" fill="#e2e8f0" opacity="0.4" />

  <!-- Multiple clustered crater depressions -->
  <g filter="url(#shadowS22)">
    <!-- Primary Pothole -->
    <path d="M 280,260 
             Q 340,210 420,220 
             Q 480,230 500,280 
             Q 520,340 470,390 
             Q 410,420 340,400 
             Q 270,380 260,320 
             Z" 
          fill="url(#potholeDepthS22)" 
          stroke="#141618" 
          stroke-width="4" />
    
    <!-- Secondary Adjacent Pothole -->
    <ellipse cx="540" cy="380" rx="60" ry="42" fill="url(#potholeDepthS22)" stroke="#141618" stroke-width="3" />
    
    <!-- Minor Tertiary Crater -->
    <ellipse cx="230" cy="390" rx="35" ry="24" fill="url(#potholeDepthS22)" stroke="#141618" stroke-width="3" />
  </g>

  <!-- Cracking Webs connecting craters -->
  <path d="M 470,360 L 510,375" stroke="#101214" stroke-width="3.5" />
  <path d="M 280,360 L 250,380" stroke="#101214" stroke-width="3" />
  <path d="M 420,220 Q 430,160 460,110" stroke="#1a1d20" stroke-width="2.5" fill="none" />
  <path d="M 340,400 Q 320,470 300,530" stroke="#1a1d20" stroke-width="2.5" fill="none" />

  <!-- Location Tag Overlay -->
  <g transform="translate(24, 24)">
    <rect width="270" height="42" rx="8" fill="#001f24" fill-opacity="0.85" stroke="#004f57" stroke-width="1.5" />
    <circle cx="20" cy="21" r="7" fill="#eab308" />
    <text x="36" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Sector 22 Market Road, CHD</text>
  </g>
  <g transform="translate(620, 24)">
    <rect width="156" height="34" rx="6" fill="#eab308" fill-opacity="0.9" />
    <text x="78" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e293b" text-anchor="middle">MODERATE RISK</text>
  </g>
</svg>