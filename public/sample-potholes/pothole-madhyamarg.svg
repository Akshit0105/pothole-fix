<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="potholeDepthMM" cx="45%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#08090b" />
      <stop offset="50%" stop-color="#16191c" />
      <stop offset="85%" stop-color="#2d333a" />
      <stop offset="100%" stop-color="#4e565f" />
    </radialGradient>
    <linearGradient id="roadSurfaceMM" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d4349" />
      <stop offset="50%" stop-color="#33383e" />
      <stop offset="100%" stop-color="#282c31" />
    </linearGradient>
    <filter id="shadowMM">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#020304" flood-opacity="0.9" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#roadSurfaceMM)" />

  <!-- Road markings: Yellow divider line -->
  <line x1="0" y1="300" x2="800" y2="300" stroke="#f59e0b" stroke-width="8" stroke-dasharray="40 30" opacity="0.8" />

  <!-- Longitude Fissures and Cracks -->
  <path d="M 120,330 Q 180,310 240,320 T 360,330" stroke="#151719" stroke-width="3" fill="none" />
  <path d="M 440,340 Q 520,360 620,340 T 730,370" stroke="#151719" stroke-width="3" fill="none" />
  <path d="M 220,180 Q 280,240 320,290" stroke="#181a1d" stroke-width="2.5" fill="none" />
  <path d="M 480,280 Q 540,220 590,160" stroke="#181a1d" stroke-width="2.5" fill="none" />

  <!-- Main Elongated Pothole Body -->
  <path d="M 230,310 
           C 270,250 380,240 450,260 
           C 540,280 580,330 550,380 
           C 510,430 420,440 340,420 
           C 260,400 210,360 230,310 Z" 
        fill="url(#potholeDepthMM)" 
        stroke="#1a1c1e" 
        stroke-width="5" 
        filter="url(#shadowMM)" />

  <!-- Inner Deep Depression -->
  <path d="M 280,320 C 310,270 410,270 460,290 C 500,310 510,350 480,380 C 430,410 360,400 310,370 Z" fill="#0d0e10" />

  <!-- Aggregate and loose stone rubble -->
  <circle cx="370" cy="340" r="14" fill="#3a4249" />
  <circle cx="420" cy="335" r="10" fill="#2b3137" />
  <circle cx="340" cy="355" r="8" fill="#4b555e" />
  <circle cx="450" cy="360" r="12" fill="#272d32" />

  <!-- Rim Highlight -->
  <path d="M 245,285 Q 350,255 450,265" stroke="#75828f" stroke-width="2" fill="none" opacity="0.6" />

  <!-- Location Tag Overlay -->
  <g transform="translate(24, 24)">
    <rect width="280" height="42" rx="8" fill="#001f24" fill-opacity="0.85" stroke="#004f57" stroke-width="1.5" />
    <circle cx="20" cy="21" r="7" fill="#f97316" />
    <text x="36" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Madhya Marg Arterial, Sector 26</text>
  </g>
  <g transform="translate(620, 24)">
    <rect width="156" height="34" rx="6" fill="#f97316" fill-opacity="0.9" />
    <text x="78" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">HIGH PRIORITY</text>
  </g>
</svg>