<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="roadSurfacePatch1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#474d54" />
      <stop offset="50%" stop-color="#3b4147" />
      <stop offset="100%" stop-color="#2c3136" />
    </linearGradient>
    <linearGradient id="freshAsphaltPatch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c1f" />
      <stop offset="50%" stop-color="#14171a" />
      <stop offset="100%" stop-color="#1c2024" />
    </linearGradient>
  </defs>

  <!-- Asphalt Road Base -->
  <rect width="800" height="600" fill="url(#roadSurfacePatch1)" />

  <!-- Road markings: Lane Divider Restored -->
  <rect x="30" y="270" width="160" height="36" rx="4" fill="#ffffff" opacity="0.9" />
  <rect x="610" y="270" width="160" height="36" rx="4" fill="#ffffff" opacity="0.9" />

  <!-- Bitumen Emulsion Tack-Coat Perimeter Seal (Saw-Cut Borders) -->
  <rect x="235" y="195" width="330" height="230" rx="8" fill="none" stroke="#0a0c0e" stroke-width="8" opacity="0.9" />

  <!-- Fresh Hot-Mix Asphalt Compaction Patch -->
  <rect x="240" y="200" width="320" height="220" rx="6" fill="url(#freshAsphaltPatch)" />

  <!-- Roller Compactor Tread Marks & Smooth Level Texture -->
  <g stroke="#262c31" stroke-width="2" opacity="0.6">
    <line x1="240" y1="230" x2="560" y2="230" />
    <line x1="240" y1="260" x2="560" y2="260" />
    <line x1="240" y1="290" x2="560" y2="290" />
    <line x1="240" y1="320" x2="560" y2="320" />
    <line x1="240" y1="350" x2="560" y2="350" />
    <line x1="240" y1="380" x2="560" y2="380" />
    <line x1="240" y1="410" x2="560" y2="410" />
  </g>

  <!-- Restored Painted Marking Through Patched Section -->
  <rect x="370" y="270" width="100" height="36" rx="2" fill="#ffffff" opacity="0.95" />

  <!-- Location Tag Overlay -->
  <g transform="translate(24, 24)">
    <rect width="280" height="42" rx="8" fill="#001f24" fill-opacity="0.85" stroke="#004f57" stroke-width="1.5" />
    <circle cx="20" cy="21" r="7" fill="#10b981" />
    <text x="36" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Sector 17 Corridor (Restored)</text>
  </g>
  <g transform="translate(600, 24)">
    <rect width="176" height="34" rx="6" fill="#059669" fill-opacity="0.9" />
    <text x="88" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">VERIFIED REPAIR</text>
  </g>
</svg>